name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN involved.
#
# History: releases 403'd on PUT from 2026-06-24 → 2026-07-17 and were assumed
# to be an account-side hold. They were not. The account has always held
# read-write on the package; the actual causes were (a) no trusted publisher
# configured for this repo/workflow, which fails pure OIDC, and (b) 2FA set to
# `auth-and-writes`, which rejects the 2FA-bypassing NPM_TOKEN on direct
# publish. A trusted publisher was registered on 2026-07-27, which resolves
# both — OIDC satisfies 2FA without a token.
#
# The trusted publisher on npmjs.com is bound to this repo AND this workflow
# filename (release.yml). Renaming this file breaks publishing until the
# publisher config is updated to match.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:   # manual re-run; dispatch against the vX.Y.Z tag, not main
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted Publishing wants Node >= 22.14.0 + npm >= 11.5.1
          # (https://docs.npmjs.com/trusted-publishers/).
          node-version: 22
          cache: npm
          # NO registry-url ON PURPOSE. Setting it makes setup-node write an
          # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
          # and inject a literal `XXXXX-XXXXX-XXXXX-XXXXX` placeholder when no
          # token is supplied. npm then authenticates with that junk token and
          # never performs the OIDC exchange — which is what produced the
          # long-running `403 Forbidden - PUT`. Trusted Publishing requires that
          # no _authToken be configured at all. registry.npmjs.org is already
          # the default registry, so nothing is lost by omitting this.
      # Node 22 ships npm 10.x; OIDC trusted publishing needs >= 11.5.1, so upgrade.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: npm run check:versions
      - run: npm test
      # TEMP DIAGNOSTIC — remove once publishing is confirmed green.
      - name: Diagnose Trusted Publishing preconditions
        run: |
          echo "npm version : $(npm --version)   (need >= 11.5.1)"
          echo "node version: $(node --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}"
          echo "--- npm config registry ---"
          npm config get registry
          echo "--- .npmrc files npm can see ---"
          for f in "$NPM_CONFIG_USERCONFIG" ./.npmrc "$HOME/.npmrc"; do
            [ -n "$f" ] && [ -f "$f" ] && { echo "== $f =="; sed -E 's/(_authToken=).*/\1<REDACTED>/' "$f"; }
          done
          echo "--- end ---"
      # Trusted Publishing: npm authenticates via the workflow's OIDC identity.
      # Provenance is generated automatically under OIDC, so `--provenance` is
      # not passed explicitly (it was a suspect during the 403 debugging and is
      # redundant here).
      - run: npm publish --access public
